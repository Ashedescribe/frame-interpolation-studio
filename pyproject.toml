[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-interpolation-studio"
version = "0.4.2"
description = "AI slow-motion and frame interpolation generator for Windows desktop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "frame-interpolation-studio contributors" }]
keywords = ["frame-interpolation", "slow-motion", "rife", "film", "vfi", "pytorch", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "numpy>=1.26",
    "av>=12.0",
    "opencv-python-headless>=4.9",
    "PySide6>=6.7",
    "pydantic>=2.7",
    "structlog>=24.1",
    "rich>=13.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
cuda = ["torch>=2.3+cu121"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyinstaller>=6.6",
]

[project.scripts]
fis = "fis.bootstrap.cli:main"
fis-gui = "fis.bootstrap.desktop:main"

[project.urls]
Homepage = "https://github.com/frame-interpolation-studio/frame-interpolation-studio"
Issues = "https://github.com/frame-interpolation-studio/frame-interpolation-studio/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"